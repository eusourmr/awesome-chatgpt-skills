name: Reconcile Navigator catalog

on:
  push:
    branches:
      - v0.5/catalog-reconcile
    paths:
      - '.github/workflows/reconcile-navigator-catalog.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5/catalog-reconcile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconcile root catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('catalog.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          ids = {e['id'] for e in data['entries']}
          if 'cs-navigator' not in ids:
              data['entries'].append({
                  'id': 'cs-navigator',
                  'name': 'CS Navigator',
                  'category': 'Productivity',
                  'status': 'verified',
                  'rating': 0,
                  'rating_state': 'unrated',
                  'reviews': 0,
                  'last_verified': '2026-09-08',
                  'compatibility': ['ChatGPT', 'Codex'],
                  'publisher': 'eusourmr',
                  'source': 'https://github.com/eusourmr/chatgpt-skills/tree/main/skills/featured/cs-navigator',
                  'path': 'skills/featured/cs-navigator'
              })
          data['review_stats']['reviewed'] = len(data['entries'])
          data['review_stats']['accepted'] = len(data['entries'])
          data['review_stats']['last_review_cycle'] = '2026-09-08'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python scripts/validate_catalog.py --write-progress
          python scripts/validate_catalog.py
          node scripts/generate-navigator-snapshot.mjs --check
      - name: Commit reconciled catalog
        run: |
          if git diff --quiet -- catalog.json PROGRESS.md; then
            echo 'Catalog already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json PROGRESS.md
          git commit -m 'Reconcile CS Navigator in public catalog'
          git push origin HEAD:v0.5/catalog-reconcile
