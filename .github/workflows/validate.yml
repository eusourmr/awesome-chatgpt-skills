name: Validate catalog

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate editorial catalog and generated README
        run: python scripts/catalog.py --check
      - name: Validate quality catalog and repository health
        run: python scripts/validate_catalog.py
      - name: Check Node installer syntax
        run: node --check installer/index.js
      - name: Test regenerative gates
        run: python -m unittest discover -s tests
