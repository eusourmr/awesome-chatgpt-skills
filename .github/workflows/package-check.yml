name: Validate npm package

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'installer/**'
      - 'skills/featured/**'
      - 'skills/regenerative-*/**'
      - 'trust/**'
      - 'catalog.json'
      - 'BUNDLES.md'
      - 'scripts/**'
      - 'sources/**'
      - 'tests/**'
      - '.github/workflows/package-check.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate repository
        run: npm run validate

      - name: Prove Security Gate blocks unsafe fixture
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/security-check.mjs --path tests/fixtures/unsafe-skill; then
            echo 'Security Gate failed to block the deliberately unsafe fixture'
            exit 1
          fi

      - name: Validate metadata-only external ingestion
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ingest-github-repo.mjs \
            --snapshot tests/fixtures/external-repo/dkyazzentwatwa-chatgpt-skills.json \
            --output /tmp/external-source.json
          node - <<'NODE'
          const x = require('/tmp/external-source.json');
          const requiredWarnings = ['license-unresolved', 'openai-yaml-legacy-shape', 'stale-audit-count'];
          if (x.skill_count !== 12) process.exit(1);
          if (x.discovery_state !== 'indexed' || x.trust_state !== 'not-evaluated') process.exit(1);
          if (x.license !== 'unresolved') process.exit(1);
          if (!requiredWarnings.every((warning) => x.warnings.includes(warning))) process.exit(1);
          if (x.skills.some((skill) => skill.copied_into_cs !== false || skill.source_owned !== true)) process.exit(1);
          NODE
          cmp /tmp/external-source.json sources/external/dkyazzentwatwa-chatgpt-skills.json

      - name: Build npm tarball
        id: pack
        shell: bash
        run: |
          npm pack --json > pack.json
          node -e "const p=require('./pack.json')[0]; if (!p || !p.filename) process.exit(1); console.log('tarball='+p.filename)" >> "$GITHUB_OUTPUT"
          cat pack.json

      - name: Smoke-test packaged CLI, Evidence Cards and target adapters
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chatgpt-skills-smoke
          mkdir -p /tmp/chatgpt-skills-smoke/host
          cd /tmp/chatgpt-skills-smoke/host
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/${{ steps.pack.outputs.tarball }}" >/dev/null
          CLI="$PWD/node_modules/.bin/chatgpt-skills"

          "$CLI" list | tee list.log
          grep -q 'cs-core: cs-navigator' list.log
          "$CLI" inspect openai-agents-sdk-builder | grep -q 'Recomendação: conditional'
          "$CLI" inspect openai-agents-sdk-builder | grep -q 'Execução: local-agent — evidência=tested'
          "$CLI" inspect regenerative-language-bridge | grep -q 'Execução: chat-native — evidência=designed'
          "$CLI" inspect cs-navigator | grep -q 'Execução: chat-native — evidência=designed'
          "$CLI" inspect chatgpt-apps-deployer | grep -q 'Integridade: tested'
          "$CLI" inspect dkyazzentwatwa/chatgpt-skills | grep -q 'Confiança: not-evaluated'
          "$CLI" inspect https://github.com/dkyazzentwatwa/chatgpt-skills | grep -q 'Licença: unresolved'

          mkdir -p /tmp/chatgpt-skills-smoke/codex
          cd /tmp/chatgpt-skills-smoke/codex
          "$CLI" install --bundle openai-ecosystem --tool codex-cli --scope project --yes
          test -f .codex/skills/openai-agents-sdk-builder/SKILL.md
          test -f .codex/chatgpt-skills-config.json
          "$CLI" doctor
          printf '\n# corruption fixture\n' >> .codex/skills/openai-agents-sdk-builder/SKILL.md
          if "$CLI" doctor; then
            echo 'doctor failed to detect modified skill content'
            exit 1
          fi

          mkdir -p /tmp/chatgpt-skills-smoke/cursor
          cd /tmp/chatgpt-skills-smoke/cursor
          "$CLI" install --bundle education --tool cursor --scope project --yes
          test -f .cursor/skills/regenerative-language-bridge/SKILL.md
          "$CLI" doctor

          mkdir -p /tmp/chatgpt-skills-smoke/portable
          cd /tmp/chatgpt-skills-smoke/portable
          "$CLI" install --bundle data-analyst --tool agents-portable --scope project --yes
          test -f .agents/skills/regenerative-impact-map/SKILL.md
          "$CLI" doctor

          mkdir -p /tmp/chatgpt-skills-smoke/chatgpt
          cd /tmp/chatgpt-skills-smoke/chatgpt
          "$CLI" install --bundle openai-ecosystem --tool chatgpt-web --scope project --yes | tee export.log
          test -f .chatgpt-skills/export/skills/openai-agents-sdk-builder/SKILL.md
          test -f .chatgpt-skills/export/packages/openai-agents-sdk-builder.zip
          test -f .chatgpt-skills/export/chatgpt-skills-export.json
          grep -q 'Pacotes prontos para upload' export.log
          "$CLI" doctor

          mkdir -p /tmp/chatgpt-skills-smoke/chatgpt-single
          cd /tmp/chatgpt-skills-smoke/chatgpt-single
          "$CLI" install --skill regenerative-language-bridge --tool chatgpt-web --scope project --yes | tee export-single.log
          test -f .chatgpt-skills/export/skills/regenerative-language-bridge/SKILL.md
          test -f .chatgpt-skills/export/skills/regenerative-language-bridge/agents/openai.yaml
          test -f .chatgpt-skills/export/packages/regenerative-language-bridge.zip
          test -f .chatgpt-skills/export/chatgpt-skills-export.json
          grep -q 'Pacotes prontos para upload' export-single.log
          grep -q 'regenerative-language-bridge.zip' export-single.log

          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p = Path('.chatgpt-skills/export/packages/regenerative-language-bridge.zip')
          with ZipFile(p) as z:
              names = z.namelist()
              assert z.testzip() is None
          expected = [
              'regenerative-language-bridge/SKILL.md',
              'regenerative-language-bridge/agents/openai.yaml',
          ]
          assert names == expected, (names, expected)
          PY

          "$CLI" doctor
          printf 'corrupt' >> .chatgpt-skills/export/packages/regenerative-language-bridge.zip
          if "$CLI" doctor; then
            echo 'doctor failed to detect modified ChatGPT upload ZIP'
            exit 1
          fi

          mkdir -p /tmp/chatgpt-skills-smoke/navigator
          cd /tmp/chatgpt-skills-smoke/navigator
          "$CLI" install --skill cs-navigator --tool chatgpt-web --scope project --yes | tee navigator.log
          test -f .chatgpt-skills/export/skills/cs-navigator/SKILL.md
          test -f .chatgpt-skills/export/skills/cs-navigator/agents/openai.yaml
          test -f .chatgpt-skills/export/skills/cs-navigator/references/catalog-snapshot.json
          test -f .chatgpt-skills/export/packages/cs-navigator.zip
          grep -q 'cs-navigator.zip' navigator.log

          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p = Path('.chatgpt-skills/export/packages/cs-navigator.zip')
          with ZipFile(p) as z:
              names = z.namelist()
              assert z.testzip() is None
              snapshot = z.read('cs-navigator/references/catalog-snapshot.json')
              assert b'"cs-navigator"' in snapshot
              assert b'"not-evaluated"' in snapshot
          expected = [
              'cs-navigator/SKILL.md',
              'cs-navigator/agents/openai.yaml',
              'cs-navigator/references/catalog-snapshot.json',
          ]
          assert names == expected, (names, expected)
          PY

          "$CLI" doctor
