name: Dispatch npm v0.3.1 publish

on:
  push:
    branches:
      - automation/publish-v0.3.1
    paths:
      - '.github/workflows/dispatch-publish-v031.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical publish workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-npm.yml --repo eusourmr/chatgpt-skills --ref main
          echo 'Dispatched publish-npm.yml on main.'
