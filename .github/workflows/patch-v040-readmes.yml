name: Patch v0.4 README guidance

on:
  push:
    branches:
      - release/v0.4.0
    paths:
      - '.github/workflows/patch-v040-readmes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.4.0
      - name: Update English and Portuguese quickstarts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = '''Published on npm as `chatgpt-skills`. Version `0.3.1` is the first recommended public CLI release; installation is reproducible because each package version bundles its own installable skills.\n\nRepository fallback:\n\n```bash\nnpx github:eusourmr/chatgpt-skills install\n```\n\nChoose a profile and tool, and the installer writes the recommended skills to `.chatgpt/skills/` plus `.chatgpt/skills-config.json`.\n\nInstall a bundle directly:\n\n```bash\nnpx chatgpt-skills install --bundle openai-ecosystem\n```'''
          new = '''Version `0.4.0` introduces the Trust Layer: target-aware installation/export, Evidence Cards, `inspect`, a stronger hash-based `doctor`, and Security Gate v1.\n\nInspect a bundled skill before adopting it:\n\n```bash\nnpx chatgpt-skills inspect openai-agents-sdk-builder\n```\n\nCheck an installed/exported bundle:\n\n```bash\nnpx chatgpt-skills doctor\n```\n\nInstall to a native project target:\n\n```bash\nnpx chatgpt-skills install --bundle openai-ecosystem --tool codex-cli --scope project --yes\nnpx chatgpt-skills install --bundle education --tool cursor --scope project --yes\nnpx chatgpt-skills install --bundle data-analyst --tool agents-portable --scope project --yes\n```\n\nFor ChatGPT, the CLI prepares files for manual upload and **does not claim direct installation into ChatGPT Web**:\n\n```bash\nnpx chatgpt-skills install --bundle openai-ecosystem --tool chatgpt-web --yes\n```\n\nRepository fallback:\n\n```bash\nnpx github:eusourmr/chatgpt-skills install\n```'''
          if old not in s:
              raise SystemExit('English quickstart anchor not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('README.pt-BR.md')
          s = p.read_text(encoding='utf-8')
          old = '''A versão `0.3.1` é a primeira release pública recomendada do CLI. Cada versão inclui suas próprias skills instaláveis, sem depender do conteúdo mutável da branch `main`.\n\nPara listar os bundles disponíveis:\n\n```bash\nnpx chatgpt-skills list\n```\n\nAlternativa direta pelo GitHub:\n\n```bash\nnpx github:eusourmr/chatgpt-skills install\n```'''
          new = '''A versão `0.4.0` inaugura a Trust Layer: instalação/exportação consciente do destino, Evidence Cards, `inspect`, `doctor` com hashes persistidos e Security Gate v1.\n\nInspecione uma skill antes de adotá-la:\n\n```bash\nnpx chatgpt-skills inspect openai-agents-sdk-builder\n```\n\nVerifique a integridade de uma instalação ou exportação:\n\n```bash\nnpx chatgpt-skills doctor\n```\n\nInstale em destinos nativos de projeto:\n\n```bash\nnpx chatgpt-skills install --bundle openai-ecosystem --tool codex-cli --scope project --yes\nnpx chatgpt-skills install --bundle education --tool cursor --scope project --yes\nnpx chatgpt-skills install --bundle data-analyst --tool agents-portable --scope project --yes\n```\n\nPara o ChatGPT, o CLI apenas prepara os arquivos para upload manual e **não afirma instalação direta no ChatGPT Web**:\n\n```bash\nnpx chatgpt-skills install --bundle openai-ecosystem --tool chatgpt-web --yes\n```\n\nPara listar bundles e destinos:\n\n```bash\nnpx chatgpt-skills list\n```\n\nAlternativa direta pelo GitHub:\n\n```bash\nnpx github:eusourmr/chatgpt-skills install\n```'''
          if old not in s:
              raise SystemExit('Portuguese quickstart anchor not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit README updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.pt-BR.md
          git commit -m 'Update v0.4 installation and trust guidance'
          git push origin HEAD:release/v0.4.0
