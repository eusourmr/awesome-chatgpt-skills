name: Check npm package name

on:
  push:
    branches:
      - release/npm-v0.3.0

permissions:
  contents: read

jobs:
  check-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check registry
        shell: bash
        run: |
          set +e
          npm view chatgpt-skills name version --json >npm-view.json 2>npm-view.err
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'PACKAGE_EXISTS=true'
            cat npm-view.json
            exit 3
          fi
          if grep -qiE 'E404|Not Found' npm-view.err; then
            echo 'PACKAGE_AVAILABLE=true'
            exit 0
          fi
          cat npm-view.err
          exit "$code"
