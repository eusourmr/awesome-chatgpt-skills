name: Check progress panel freshness

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild progress panel and require no diff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_catalog.py --write-progress
          git diff --exit-code -- PROGRESS.md
