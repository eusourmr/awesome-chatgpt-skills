name: Inspect npm v0.3.1 CLI

on:
  push:
    branches:
      - automation/publish-v0.3.1
    paths:
      - '.github/workflows/inspect-npm-v031.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Inspect registry and installed package
        shell: bash
        run: |
          set -euo pipefail
          echo '--- registry bin ---'
          npm view chatgpt-skills@0.3.1 bin --json
          echo '--- pack public tarball ---'
          npm pack chatgpt-skills@0.3.1 --json > /tmp/pack.json
          cat /tmp/pack.json
          tgz=$(node -p "require('/tmp/pack.json')[0].filename")
          echo '--- tar entries ---'
          tar -tvzf "$tgz" | grep -E 'package/package.json|package/installer/index.js'
          echo '--- install ---'
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null 2>&1
          npm install chatgpt-skills@0.3.1
          echo '--- root package json ---'
          cat node_modules/chatgpt-skills/package.json
          echo '--- installer file ---'
          ls -la node_modules/chatgpt-skills/installer/index.js
          head -n 2 node_modules/chatgpt-skills/installer/index.js
          echo '--- .bin ---'
          ls -la node_modules/.bin || true
          if [ -e node_modules/.bin/chatgpt-skills ]; then
            readlink -f node_modules/.bin/chatgpt-skills || true
            node_modules/.bin/chatgpt-skills list || true
          fi
          echo '--- npm exec ---'
          npm exec --package=chatgpt-skills@0.3.1 -- chatgpt-skills list || true
