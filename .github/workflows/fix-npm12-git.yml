name: Fix npm 12 Git invocation

on:
  push:
    branches:
      - fix/npm12-git-pre-release
    paths:
      - '.github/workflows/fix-npm12-git.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/npm12-git-pre-release

      - name: Update npm 12-safe Git commands
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/CHATGPT_IN_PRODUCT_TESTING.md'): [
                  (
                      'npx --yes github:eusourmr/chatgpt-skills#8b814c93980175fa61da141d659cfa28a8e6bd92 install --skill cs-navigator --tool chatgpt-web --yes',
                      'npx --yes --allow-git=root github:eusourmr/chatgpt-skills#8b814c93980175fa61da141d659cfa28a8e6bd92 install --skill cs-navigator --tool chatgpt-web --yes'
                  ),
                  (
                      'This should create:',
                      'npm 12 defaults Git fetching to disabled. `--allow-git=root` opts in only for the explicitly requested root Git package for this command; do not change the global npm policy.\n\nThis should create:'
                  ),
              ],
              Path('README.md'): [
                  ('npx github:eusourmr/chatgpt-skills install', 'npx --allow-git=root github:eusourmr/chatgpt-skills install'),
                  ('Repository fallback:', 'Repository fallback (npm 12-safe; Git access is enabled only for this command):'),
              ],
              Path('README.pt-BR.md'): [
                  ('npx github:eusourmr/chatgpt-skills install', 'npx --allow-git=root github:eusourmr/chatgpt-skills install'),
                  ('Alternativa direta pelo GitHub:', 'Alternativa direta pelo GitHub (compatível com npm 12; acesso Git liberado somente neste comando):'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Prove pinned GitHub invocation on npm 12
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@12 >/dev/null
          npm --version
          rm -rf /tmp/chatgpt-skills-npm12
          mkdir -p /tmp/chatgpt-skills-npm12
          cd /tmp/chatgpt-skills-npm12
          npx --yes --allow-git=root github:eusourmr/chatgpt-skills#8b814c93980175fa61da141d659cfa28a8e6bd92 list | tee list.log
          grep -q 'cs-core: cs-navigator' list.log

      - name: Commit documentation changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.pt-BR.md docs/CHATGPT_IN_PRODUCT_TESTING.md
          git commit -m 'Document npm 12-safe Git invocation'
          git push origin HEAD:fix/npm12-git-pre-release
