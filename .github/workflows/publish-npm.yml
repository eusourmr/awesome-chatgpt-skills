name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate repository
        run: npm run validate

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}."
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already published
        id: registry
        shell: bash
        run: |
          set +e
          npm view "chatgpt-skills@${{ steps.version.outputs.value }}" version >npm-view.out 2>npm-view.err
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            published=$(cat npm-view.out)
            if [ "$published" != "${{ steps.version.outputs.value }}" ]; then
              echo "Registry returned unexpected version: $published"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "chatgpt-skills@${published} is already published; skipping duplicate publish."
            exit 0
          fi

          if grep -qiE 'E404|Not Found' npm-view.err; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat npm-view.err
          exit "$code"

      - name: Publish to npm with trusted publishing
        if: steps.registry.outputs.exists == 'false'
        run: npm publish
