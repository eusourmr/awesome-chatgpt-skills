name: Verify public npm package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-npm-public.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify published version
        shell: bash
        run: |
          set -euo pipefail
          published=$(npm view chatgpt-skills@0.3.0 version)
          test "$published" = "0.3.0"
          echo "PUBLISHED_VERSION=$published"
      - name: Execute public CLI
        run: npx --yes chatgpt-skills@0.3.0 list
      - name: Install a public bundle
        shell: bash
        run: |
          tmp=$(mktemp -d)
          cd "$tmp"
          npx --yes chatgpt-skills@0.3.0 install --bundle openai-ecosystem --tool codex-cli --yes
          node -e "const c=require(process.cwd()+'/.chatgpt/skills-config.json'); if(c.package!=='chatgpt-skills'||c.package_version!=='0.3.0'||c.distribution!=='bundled'||c.enabled_skills.length!==4) process.exit(1); console.log(JSON.stringify(c,null,2))"
