name: Finish repository rename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-rename.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace legacy repository slug
        shell: bash
        run: |
          git grep -Il 'awesome-chatgpt-skills' -- ':!.github/workflows/finish-rename.yml' | xargs -r sed -i 's/awesome-chatgpt-skills/chatgpt-skills/g'
          python scripts/catalog.py --write
          python scripts/catalog.py --check
          python scripts/validate_catalog.py
          node --check installer/index.js
          python -m unittest discover -s tests

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No legacy references found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish chatgpt-skills rename'
          git push
